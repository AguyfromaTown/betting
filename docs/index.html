<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  h1 {
    font-size: 24px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #8b949e;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #1c1f2b;
    border-radius: 8px;
    padding: 16px 24px;
    flex: 1;
    min-width: 120px;
  }
  .stat-card .label {
    font-size: 12px;
    text-transform: uppercase;
    color: #8b949e;
    letter-spacing: 0.5px;
  }
  .stat-card .value {
    font-size: 28px;
    font-weight: 700;
    margin-top: 4px;
  }
  .stat-card .value.green { color: #3fb950; }
  .stat-card .value.red { color: #f85149; }
  .stat-card .value.white { color: #e1e4e8; }
  .stat-card .value.yellow { color: #d29922; }

  .table-wrap {
    background: #1c1f2b;
    border-radius: 8px;
    overflow-x: auto;
    padding: 4px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th {
    text-align: left;
    padding: 12px 16px;
    color: #8b949e;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #30363d;
  }
  td {
    padding: 10px 16px;
    border-bottom: 1px solid #21262d;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #252836; }

  .result-win { color: #3fb950; font-weight: 600; }
  .result-loss { color: #f85149; font-weight: 600; }
  .result-pending { color: #8b949e; }
  .grade-top { color: #3fb950; font-weight: 600; }
  .grade-value { color: #58a6ff; font-weight: 600; }
  .grade-moderate { color: #d29922; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #8b949e;
  }
  .empty-state h2 { font-size: 20px; margin-bottom: 8px; color: #e1e4e8; }

  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #484f58;
  }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .stat-card { min-width: calc(50% - 6px); }
    th, td { padding: 8px 10px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Betting Log</h1>
  <p class="subtitle" id="last-updated">Loading...</p>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="label">Total Bets</div><div class="value white" id="total-bets">-</div></div>
    <div class="stat-card"><div class="label">Win Rate</div><div class="value white" id="win-rate">-</div></div>
    <div class="stat-card"><div class="label">Net P&amp;L</div><div class="value white" id="pnl">-</div></div>
    <div class="stat-card"><div class="label">Bankroll</div><div class="value white" id="last-balance">-</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Match</th>
          <th>Bet</th>
          <th>Odds</th>
          <th>Stake</th>
          <th>Result</th>
          <th>Return</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state">
      <h2>No bets logged yet</h2>
      <p>Run the tennis bot or /tennis-picks to get started.</p>
    </div>
  </div>

  <div class="footer">
    Data from <code>bets-log.csv</code> &middot; Updated automatically
  </div>
</div>

<script>
async function loadLog() {
  const resp = await fetch('https://raw.githubusercontent.com/AguyfromaTown/betting/main/bets-log.csv');
  const text = await resp.text();
  const lines = text.trim().split('\n');

  if (lines.length <= 1) {
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('last-updated').textContent = 'No entries yet';
    return;
  }

  document.getElementById('empty-state').style.display = 'none';

  const rows = lines.slice(1).map(line => {
    const cols = line.split(',');
    return {
      date: cols[0] || '',
      match: cols[1] || '',
      bet: cols[2] || '',
      odds: cols[3] || '',
      stake: cols[4] || '',
      result: cols[5] || '',
      ret: cols[6] || '',
      balance: cols[7] || ''
    };
  });

  rows.reverse(); // newest first

  const settled = rows.filter(r => r.result.toLowerCase() === 'win' || r.result.toLowerCase() === 'loss');
  const wins = settled.filter(r => r.result.toLowerCase() === 'win');
  const winRate = settled.length ? ((wins.length / settled.length) * 100).toFixed(1) : '-';
  const totalStake = rows.reduce((s, r) => s + (parseFloat(r.stake) || 0), 0);
  const totalReturn = rows.reduce((s, r) => s + (parseFloat(r.ret) || 0), 0);
  const pnl = (totalReturn - totalStake).toFixed(2);
  const lastBalance = rows.find(r => r.balance)?.balance || '-';

  document.getElementById('total-bets').textContent = rows.length;
  document.getElementById('win-rate').textContent = settled.length ? winRate + '%' : '-';

  const pnlEl = document.getElementById('pnl');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl;
  pnlEl.className = 'value ' + (pnl > 0 ? 'green' : pnl < 0 ? 'red' : 'white');

  const balEl = document.getElementById('last-balance');
  balEl.textContent = lastBalance !== '-' ? '€' + lastBalance : '-';

  document.getElementById('last-updated').textContent =
    `Last updated: ${rows[0].date || 'unknown'} · ${rows.length} entries`;

  const tbody = document.getElementById('log-body');
  tbody.innerHTML = '';

  for (const r of rows) {
    const tr = document.createElement('tr');

    const resultClass = r.result.toLowerCase() === 'win' ? 'result-win'
      : r.result.toLowerCase() === 'loss' ? 'result-loss'
      : 'result-pending';

    const resultDisplay = r.result || '—';

    const returnDisplay = r.ret || '—';

    tr.innerHTML = `
      <td>${r.date}</td>
      <td>${r.match}</td>
      <td>${r.bet}</td>
      <td>${r.odds}</td>
      <td>${r.stake}</td>
      <td class="${resultClass}">${resultDisplay}</td>
      <td>${returnDisplay}</td>
    `;
    tbody.appendChild(tr);
  }
}

loadLog().catch(err => {
  document.getElementById('last-updated').textContent = 'Failed to load: ' + err.message;
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('empty-state').innerHTML = '<h2>Error loading data</h2><p>Make sure bets-log.csv exists in the repo.</p>';
});
</script>
</body>
</html>
