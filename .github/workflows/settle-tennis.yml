name: Settle Tennis Bets

on:
  schedule:
    - cron: '30 2,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tennis-picks
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tennis-bot/requirements-test.txt
      - name: Run tests with required coverage
        run: |
          python -m coverage run -m unittest discover -s tennis-bot -p "test_*.py"
          python -m coverage report --fail-under=70 > coverage-report.txt
          cat coverage-report.txt
          python -m coverage xml
      - name: Publish test coverage
        if: always()
        run: |
          echo "## Tennis test coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-report.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report unavailable because the test command did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-coverage-settlement
          path: |
            coverage.xml
            coverage-report.txt
          if-no-files-found: warn
      - name: Settle pending bets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: python tennis-bot/tennis_bot.py --settle-only
      - name: Publish settlement alerts
        if: always()
        run: |
          if [ -f settlement-alerts.md ]; then
            cat settlement-alerts.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "OVERDUE UNRESOLVED OUTCOMES" settlement-alerts.md; then
              echo "::warning::One or more tennis outcomes are overdue and unresolved"
            fi
          fi
      - name: Publish API quota summary
        if: always()
        run: |
          if [ -f api-quota.md ]; then
            cat api-quota.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish source latency and freshness
        if: always()
        run: |
          if [ -f source-health.md ]; then
            cat source-health.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "STALE RESPONSES DETECTED" source-health.md; then
              echo "::warning::The tennis bot used one or more stale cached source responses"
            fi
          fi
      - name: Publish rejection and pick count health
        if: always()
        run: |
          if [ -f operations-alerts.md ]; then
            cat operations-alerts.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "ABNORMAL REJECTION OR PICK COUNTS" operations-alerts.md; then
              echo "::warning::Tennis rejection or authorized-pick counts are outside robust historical limits"
            fi
          fi
      - name: Publish unresolved player identities
        if: always()
        run: |
          if [ -f unresolved-player-identities.md ]; then
            cat unresolved-player-identities.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "OVERDUE UNRESOLVED IDENTITIES" unresolved-player-identities.md; then
              echo "::warning::One or more unresolved tennis player identities are overdue for review"
            fi
          fi
      - name: Publish provider schema health
        if: always()
        run: |
          if [ -f provider-schema-alerts.md ]; then
            cat provider-schema-alerts.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "SCHEMA CHANGE ALERTS" provider-schema-alerts.md; then
              echo "::warning::A tennis data provider response no longer matches the expected schema"
            fi
          fi
      - name: Commit settlement
        if: always()
        run: |
          git config --local user.email "tennis-bot@github.com"
          git config --local user.name "Tennis Bot"
          git add -A
          git diff --staged --quiet || git commit -m "Settle tennis bets"
          git push
