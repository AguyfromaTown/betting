name: Dependency Vulnerability Audit

on:
  push:
    paths:
      - 'tennis-bot/requirements*.txt'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'tennis-bot/requirements*.txt'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Audit Python dependency tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tennis-bot/requirements-test.txt
      - name: Install pinned vulnerability scanner
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit production and test dependencies
        run: >-
          python -m pip_audit
          --requirement tennis-bot/requirements-test.txt
          --strict
          --progress-spinner off
          --format json
          --output dependency-audit.json
      - name: Publish vulnerability summary
        if: always()
        shell: bash
        run: |
          echo "## Python dependency vulnerability audit" >> "$GITHUB_STEP_SUMMARY"
          if [ -s dependency-audit.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          payload = json.loads(Path("dependency-audit.json").read_text(encoding="utf-8"))
          dependencies = payload.get("dependencies", []) if isinstance(payload, dict) else payload
          vulnerable = [(item.get("name", "unknown"), item.get("version", "unknown"), item.get("vulns", []))
                        for item in dependencies if item.get("vulns")]
          print(f"Audited dependencies: {len(dependencies)}")
          print(f"Vulnerable packages: {len(vulnerable)}")
          for name, version, findings in vulnerable:
              identifiers = ", ".join(str(finding.get("id", "unknown")) for finding in findings)
              print(f"- `{name} {version}`: {identifiers}")
          PY
          else
            echo "Audit report unavailable; inspect the failed audit step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tennis-dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
