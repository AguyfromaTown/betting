name: Daily Tennis Picks

on:
  schedule:
    # Runs daily at 06:00 UTC (adjust for your timezone)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Match date (YYYY-MM-DD, leave blank for today)'
        required: false
        default: ''
      odds_min:
        description: 'Min decimal odds'
        required: false
        default: '1.5'
      odds_max:
        description: 'Max decimal odds'
        required: false
        default: '1.6'
      bankroll:
        description: 'Bankroll override (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tennis-bot/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tennis-bot -p "test_*.py"

      - name: Run tennis bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          ARGS="$ARGS --odds-min ${{ github.event.inputs.odds_min || '1.5' }}"
          ARGS="$ARGS --odds-max ${{ github.event.inputs.odds_max || '1.6' }}"
          if [ -n "${{ github.event.inputs.bankroll }}" ]; then
            ARGS="$ARGS --bankroll ${{ github.event.inputs.bankroll }}"
          fi
          python tennis-bot/tennis_bot.py $ARGS

      - name: Commit results
        run: |
          git config --local user.email "tennis-bot@github.com"
          git config --local user.name "Tennis Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "Daily picks $(date +'%Y-%m-%d')"
          git push
