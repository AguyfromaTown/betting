name: Daily Tennis Picks

on:
  schedule:
    # Three discovery windows catch fixtures and markets added later in the day.
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Match date (YYYY-MM-DD, leave blank for today)'
        required: false
        default: ''
      odds_min:
        description: 'Min decimal odds'
        required: false
        default: '1.5'
      odds_max:
        description: 'Max decimal odds'
        required: false
        default: '1.6'
      bankroll:
        description: 'Bankroll override (optional)'
        required: false
        default: ''
      paper_trading:
        description: 'Simulate bets without changing the real bankroll'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-tennis-picks
  cancel-in-progress: false

jobs:
  run-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tennis-bot/requirements-test.txt

      - name: Run tests
        run: |
          python -m coverage run -m unittest discover -s tennis-bot -p "test_*.py"
          python -m coverage report --fail-under=70 > coverage-report.txt
          cat coverage-report.txt
          python -m coverage xml

      - name: Publish test coverage
        if: always()
        run: |
          echo "## Tennis test coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-report.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report unavailable because the test command did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tennis-coverage-daily
          path: |
            coverage.xml
            coverage-report.txt
          if-no-files-found: warn

      - name: Run tennis bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          ARGS="$ARGS --odds-min ${{ github.event.inputs.odds_min || '1.5' }}"
          ARGS="$ARGS --odds-max ${{ github.event.inputs.odds_max || '1.6' }}"
          if [ -n "${{ github.event.inputs.bankroll }}" ]; then
            ARGS="$ARGS --bankroll ${{ github.event.inputs.bankroll }}"
          fi
          if [ "${{ github.event.inputs.paper_trading }}" = "true" ]; then
            ARGS="$ARGS --paper-trading"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --force"
          fi
          python tennis-bot/tennis_bot.py $ARGS

      - name: Publish API quota summary
        if: always()
        run: |
          if [ -f api-quota.md ]; then
            cat api-quota.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish source latency and freshness
        if: always()
        run: |
          if [ -f source-health.md ]; then
            cat source-health.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "STALE RESPONSES DETECTED" source-health.md; then
              echo "::warning::The tennis bot used one or more stale cached source responses"
            fi
          fi

      - name: Publish rejection and pick count health
        if: always()
        run: |
          if [ -f operations-alerts.md ]; then
            cat operations-alerts.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "ABNORMAL REJECTION OR PICK COUNTS" operations-alerts.md; then
              echo "::warning::Tennis rejection or authorized-pick counts are outside robust historical limits"
            fi
          fi

      - name: Publish provider schema health
        if: always()
        run: |
          if [ -f provider-schema-alerts.md ]; then
            cat provider-schema-alerts.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "SCHEMA CHANGE ALERTS" provider-schema-alerts.md; then
              echo "::warning::A tennis data provider response no longer matches the expected schema"
            fi
          fi

      - name: Publish alias review queue
        if: always()
        run: |
          if [ -f unresolved-player-identities.md ]; then
            cat unresolved-player-identities.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "OVERDUE UNRESOLVED IDENTITIES" unresolved-player-identities.md; then
              echo "::warning::One or more unresolved tennis player identities are overdue for review"
            fi
          fi
          if [ -f player-alias-review.csv ]; then
            PENDING=$(python -c "import csv; print(sum((r.get('STATUS') or '').strip().lower() == 'pending' for r in csv.DictReader(open('player-alias-review.csv', encoding='utf-8'))))")
            echo "## Player alias review" >> "$GITHUB_STEP_SUMMARY"
            echo "Pending identities: $PENDING" >> "$GITHUB_STEP_SUMMARY"
            if [ "$PENDING" -gt 0 ]; then
              echo "::warning::$PENDING tennis player identity alias(es) require manual review"
            fi
          fi

      - name: Commit results
        if: always()
        run: |
          git config --local user.email "tennis-bot@github.com"
          git config --local user.name "Tennis Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "Daily picks $(date +'%Y-%m-%d')"
          git push
